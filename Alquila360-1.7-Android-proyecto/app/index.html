height:1.4;font-size:13px}.welcome-compact .hint{font-size:12px;color:#66788c;margin-top:5px}@media(max-width:600px){.welcome-compact{padding:13px;gap:10px}.welcome-compact h2{font-size:16px}.welcome-compact .welcome-icon{font-size:23px}} 
:root{--ink:#183044;--teal:#087f83;--bg:#f1f6f8}body{background:var(--bg);color:var(--ink)}header{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(120deg,#102c45,#136d78);padding:16px 20px;box-shadow:0 6px 24px #112b4225}.brand{display:flex;align-items:center;gap:12px}.brand img{border-radius:13px;background:#ffffff1b;padding:3px}.brand b{display:block;font-size:24px}.brand small{display:block;color:#d0e6eb;margin-top:2px}.version{font-size:10px;letter-spacing:1px;color:#dbf7f4;border:1px solid #ffffff4d;border-radius:20px;padding:5px 8px}main{max-width:920px}nav{background:white;padding:9px;border-radius:14px;box-shadow:0 3px 18px #173e4d10;gap:6px}nav button{border-radius:9px;font-weight:600}button{background:var(--teal);font-weight:600;min-height:40px}button:active{transform:scale(.98)}.card{border:1px solid #e5eef1;box-shadow:0 5px 24px #102c4510;border-radius:17px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stats>.card{min-width:0}.stats>.card:nth-child(n+5){grid-column:span 2}.value{font-size:25px;color:var(--teal);margin-top:8px}h1{font-size:23px;letter-spacing:-.5px}h2{font-size:18px}input,select{background:#fff;border:1px solid #c9d8df}.backupbar{background:#ffffffa8;padding:8px;border-radius:12px}.filterbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.filterbar label{flex:1;min-width:110px}.filterbar select{margin-bottom:0}.filter-summary{color:#55707c;font-size:13px;margin:9px 0 0}.receipt-overlay{position:fixed;inset:0;background:#0b213d99;z-index:50;overflow:auto;padding:12px}.receipt-sheet{max-width:700px;margin:12px auto;background:white;border-radius:18px;padding:16px;min-height:80vh}.receipt-toolbar{display:flex;gap:10px;justify-content:space-between;margin-bottom:14px}.receipt-paper{padding:20px;border:1px solid #e4ebef;border-radius:12px}.receipt-paper h2{color:#087f83}.receipt-paper p{padding:9px 0;border-bottom:1px solid #edf2f4}.receipt-paper small{color:#5b6973}.hide{display:none!important}@media(max-width:600px){header{padding:14px}.brand b{font-size:21px}.brand small{font-size:11px}.brand img{width:40px;height:40px}main{padding:10px}nav{flex-wrap:nowrap;overflow-x:auto}.card{padding:14px}.stats{gap:9px}.value{font-size:22px}.receipt-paper{padding:12px}.receipt-toolbar button{font-size:12px;padding:8px}}
</style></head><body><header><div class="brand"><img src="icon-192.png" alt="" width="46" height="46"><div><b>Alquila360</b><small>Tu patrimonio, bajo control</small></div></div><span class="version">BETA 1.7</span></header><main><div class="backupbar"><button id="import" type="button" class="secondary">Importar copia antigua</button><button id="export-secure" type="button">Exportar cifrada</button><button id="import-secure" type="button" class="secondary">Importar cifrada</button><input id="importfile" type="file" accept="application/json,.json" hidden></div><nav id="nav"></nav><div id="backbar" class="backbar hide"><button type="button" id="go-home" class="secondary">← Volver al inicio</button></div><section id="view"></section></main><div id="receipt-modal" class="receipt-overlay hide" role="dialog" aria-modal="true"><div class="receipt-sheet"><div class="receipt-toolbar"><button id="close-receipt" type="button" class="secondary">← Volver a cobros</button><button id="print-receipt" type="button">Guardar PDF</button></div><div id="receipt-content"></div></div></div><script>
const sections=['Resumen','Inmuebles','Inquilinos','Contratos','Cobros','Gastos','Incidencias','Ajustes'];let current='Resumen';let filterYear='all',filterMonth='all';const initial={Inmuebles:[],Inquilinos:[],Contratos:[],Cobros:[],Gastos:[],Incidencias:[]};let db;try{db=JSON.parse(localStorage.getItem('alquila360-data'))||initial}catch{db=initial}for(const s of sections.slice(1,-1))db[s]??=[];db.Ajustes??={propietario:'',nif:'',direccion:'',email:''};function save(){localStorage.setItem('alquila360-data',JSON.stringify(db))}function safe(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'})}const fields={Inmuebles:[['nombre','Nombre o dirección','text'],['tipo','Tipo (piso, garaje, local...)','text'],['renta','Alquiler mensual (€)','number']],Inquilinos:[['nombre','Nombre completo','text'],['contacto','Teléfono o email','text']],Contratos:[['inmueble','Inmueble','text'],['inquilino','Inquilino','text'],['inicio','Fecha de inicio','date'],['fin','Fecha de fin','date'],['renta','Renta mensual (€)','number'],['diaCobro','Día de cobro (1-31)','number']],Cobros:[['concepto','Concepto / inmueble','text'],['fecha','Fecha','date'],['importe','Importe (€)','number'],['estado','Estado (pagado/pendiente)','text']],Gastos:[['concepto','Concepto / inmueble','text'],['fecha','Fecha','date'],['importe','Importe (€)','number']],Incidencias:[['inmueble','Inmueble','text'],['descripcion','Descripción','text'],['estado','Estado','text']]};function localToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dueDate(month,day){const [y,m]=month.split('-').map(Number);const last=new Date(y,m,0).getDate();return `${month}-${String(Math.min(Math.max(Number(day)||1,1),last)).padStart(2,'0')}`}
function contractKey(c,i){return String(c.id||`${c.inmueble}|${c.inquilino}|${c.inicio}|${i}`)}
function generateDue(){const today=localToday();let added=0;for(let i=0;i<db.Contratos.length;i++){const c=db.Contratos[i];if(!c.inicio||!Number(c.renta)||!c.diaCobro)continue;let [y,m]=c.inicio.slice(0,7).split('-').map(Number);let guard=0;while(`${y}-${String(m).padStart(2,'0')}`<=today.slice(0,7)&&guard++<1200){const month=`${y}-${String(m).padStart(2,'0')}`,fecha=dueDate(month,c.diaCobro),key=contractKey(c,i);if(fecha>=c.inicio&&(!c.fin||fecha<=c.fin)&&fecha<=today&&!db.Cobros.some(x=>x.contratoKey===key&&x.mes===month)&&!db.Cobros.some(x=>x.concepto===`Alquiler ${c.inmueble} - ${month}`)){db.Cobros.push({concepto:`Alquiler ${c.inmueble} - ${month}`,fecha,importe:c.renta,estado:'pendiente',contratoKey:key,mes:month,inquilino:c.inquilino,inmueble:c.inmueble});added++}m++;if(m>12){m=1;y++}}}if(added)save();return added}
function overdue(c){return String(c.estado||'').toLowerCase()!=='pagado'&&Boolean(c.fecha)&&c.fecha<localToday()}
function render(){generateDue();document.getElementById('backbar').classList.toggle('hide',current==='Resumen');document.getElementById('go-home').onclick=()=>{current='Resumen';render();window.scrollTo(0,0)};document.getElementById('nav').innerHTML=sections.map(s=>`<button class="${current===s?'':'secondary'}" data-tab="${s}">${s}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{current=b.dataset.tab;render()});let v=document.getElementById('view');if(current==='Ajustes'){v.innerHTML=`<h1>Datos del propietario</h1><div class="card"><p>Estos datos aparecerán en los recibos. Se guardan únicamente en este dispositivo.</p><form id="owner">${[['propietario','Nombre completo'],['nif','NIF (opcional)'],['direccion','Dirección (opcional)'],['email','Correo (opcional)']].map(([k,l])=>`<label>${l}<input name="${k}" value="${safe(db.Ajustes[k])}"></label>`).join('')}<button>Guardar datos</button></form></div>`;document.getElementById('owner').onsubmit=e=>{e.preventDefault();db.Ajustes=Object.fromEntries(new FormData(e.target).entries());save();alert('Datos guardados')};return}if(current==='Resumen'){let rent=db.Contratos.reduce((a,x)=>a+Number(x.renta||0),0),paid=db.Cobros.filter(x=>x.estado?.toLowerCase()==='pagado').reduce((a,x)=>a+Number(x.importe||0),0),expenses=db.Gastos.reduce((a,x)=>a+Number(x.importe||0),0);const today=localToday(),impagos=db.Cobros.filter(overdue),upcoming=db.Contratos.filter(c=>c.fin&&c.fin>=today&&c.fin<=new Date(Date.now()+60*86400000).toISOString().slice(0,10));v.innerHTML=`<h1>Panel de control</h1><div class="stats"><div class="card">Inmuebles<div class="value">${db.Inmuebles.length}</div></div><div class="card">Renta mensual contratada<div class="value">${money(rent)}</div></div><div class="card">Cobros registrados como pagados<div class="value">${money(paid)}</div></div><div class="card">Gastos registrados<div class="value">${money(expenses)}</div></div><div class="card"><h2>Impagos (${impagos.length})</h2>${impagos.length?impagos.map(c=>`<p>🔴 ${safe(c.concepto)} — ${money(c.importe)} · Venció el ${safe(c.fecha)}</p>`).join(''):'<p class="muted">No hay impagos registrados.</p>'}</div><div class="card"><h2>Próximos vencimientos (60 días)</h2>${upcoming.length?upcoming.map(c=>`<p>⚠️ ${safe(c.inmueble)} — ${safe(c.inquilino)}: ${safe(c.fin)}</p>`).join(''):'<p class="muted">No hay contratos próximos a vencer.</p>'}</div><div class="card welcome-compact"><span class="welcome-icon" aria-hidden="true">⌂</span><div><h2>Bienvenido a Alquila360</h2><p>Gestiona tus alquileres y consulta tus cobros desde aquí.</p><div class="hint">Recuerda exportar copias de seguridad periódicamente.</div></div></div>`;return}let rows=db[current];let filterPrefix='';if(['Cobros','Gastos'].includes(current)){const years=[...new Set(rows.map(r=>String(r.fecha||'').slice(0,4)).filter(y=>/^\d{4}$/.test(y)))].sort().reverse();const filterHtml=`<div class="card"><h2>Filtrar por fecha</h2><div class="filterbar"><label>Año<select id="filter-year"><option value="all">Todos los años</option>${years.map(y=>`<option value="${y}" ${filterYear===y?'selected':''}>${y}</option>`).join('')}</select></label><label>Mes<select id="filter-month"><option value="all">Todos los meses</option>${Array.from({length:12},(_,i)=>`<option value="${String(i+1).padStart(2,'0')}" ${filterMonth===String(i+1).padStart(2,'0')?'selected':''}>${new Date(2025,i,1).toLocaleString('es-ES',{month:'long'})}</option>`).join('')}</select></label></div><p class="filter-summary">Mostrando <b id="filter-count">0</b> registros</p></div>`;rows=rows.map((r,i)=>({...r,__idx:i})).filter(r=>(filterYear==='all'||String(r.fecha||'').slice(0,4)===filterYear)&&(filterMonth==='all'||String(r.fecha||'').slice(5,7)===filterMonth));filterPrefix=filterHtml;}v.innerHTML=filterPrefix+`<h1>${current}</h1>${current==='Cobros'?'<div class="card"><h2>Mensualidades</h2><p>Los cobros vencidos se generan al abrir la app. También puedes generar manualmente los de un mes. Los contratos anteriores deben tener configurado su día de cobro.</p><label>Mes <input id="mes-cobro" type="month" value="'+new Date().toISOString().slice(0,7)+'"></label><button id="generar-mes" type="button">Generar mensualidades</button></div>':''}<div class="card"><h2 id="form-title">Añadir registro</h2><form id="add">${fields[current].map(([key,label,type])=>`<label>${label}<input name="${key}" type="${type}" ${type==='number'?'step="0.01" min="0"':''} required></label>`).join('')}<button>Guardar</button></form></div><div class="card scroll"><h2>Registros (${rows.length})</h2>${rows.length?`<table><thead><tr>${fields[current].map(f=>`<th>${f[1]}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr>${fields[current].map(([k])=>`<td>${safe(r[k])}</td>`).join('')}<td>${current==='Cobros'?`<button class="secondary" data-pay="${r.__idx??i}">${String(r.estado).toLowerCase()==='pagado'?'Marcar pendiente':'Marcar pagado'}</button> <button class="secondary" data-recibo="${r.__idx??i}">Recibo PDF</button> <button class="secondary" data-share="${r.__idx??i}">Compartir</button> `:''}<button class="secondary" data-edit="${r.__idx??i}">Editar</button> <button class="secondary" data-delete="${r.__idx??i}">Eliminar</button></td></tr>`).join('')}</tbody></table>`:'<p class="muted">Todavía no hay registros.</p>'}</div>`;if(['Cobros','Gastos'].includes(current)){document.getElementById('filter-count').textContent=rows.length;document.getElementById('filter-year').onchange=e=>{filterYear=e.target.value;render()};document.getElementById('filter-month').onchange=e=>{filterMonth=e.target.value;render()}}if(current==='Cobros'){document.getElementById('generar-mes').onclick=()=>{let mes=document.getElementById('mes-cobro').value;if(!mes){alert('Selecciona un mes');return}let added=0;for(const c of db.Contratos){if(!c.inicio||!c.diaCobro||dueDate(mes,c.diaCobro)<c.inicio||c.inicio.slice(0,7)>mes||c.fin&&c.fin.slice(0,7)<mes)continue;const concepto=`Alquiler ${c.inmueble} - ${mes}`;if(db.Cobros.some(x=>x.concepto===concepto))continue;db.Cobros.push({concepto,fecha:dueDate(mes,c.diaCobro),importe:c.renta,estado:'pendiente',contratoKey:contractKey(c,db.Contratos.indexOf(c)),mes,inquilino:c.inquilino,inmueble:c.inmueble});added++}save();render();alert(`Generados ${added} cobros nuevos`)};document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{const c=db.Cobros[Number(b.dataset.pay)];c.estado=String(c.estado).toLowerCase()==='pagado'?'pendiente':'pagado';save();render()});document.querySelectorAll('[data-recibo]').forEach(b=>b.onclick=()=>receipt(db.Cobros[Number(b.dataset.recibo)]));document.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>shareReceipt(db.Cobros[Number(b.dataset.share)]))}let editing=-1;document.getElementById('add').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target).entries());if(current==='Contratos'){const day=Number(data.diaCobro);if(!Number.isInteger(day)||day<1||day>31){alert('El día de cobro debe estar entre 1 y 31');return}if(data.fin&&data.fin<data.inicio){alert('La fecha de fin no puede ser anterior al inicio');return}if(editing>=0)data.id=db.Contratos[editing].id||crypto.randomUUID();else data.id=crypto.randomUUID()}if(editing>=0)db[current][editing]={...db[current][editing],...data};else db[current].push(data);save();render()};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=Number(b.dataset.edit);let r=db[current][editing];let form=document.getElementById('add');for(let [key] of fields[current])form.elements[key].value=r[key]??'';document.getElementById('form-title').textContent='Editar registro';form.querySelector('button').textContent='Guardar cambios';form.scrollIntoView({behavior:'smooth'});});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar este registro?')){db[current].splice(Number(b.dataset.delete),1);save();render()}})}render();
function backupPayload(){return JSON.stringify({app:'Alquila360',version:1,data:db},null,2)}
document.getElementById('export-secure').onclick=()=>{if(!window.AlquilaAndroid){alert('La exportación cifrada solo está disponible en Android');return}const pass=prompt('Contraseña de la copia (mínimo 12 caracteres). Si la pierdes no podrás recuperarla:');if(pass===null)return;if(pass.length<12){alert('Usa al menos 12 caracteres');return}const verify=prompt('Repite la contraseña:');if(verify!==pass){alert('Las contraseñas no coinciden');return}AlquilaAndroid.exportEncryptedBackup(backupPayload(),pass)};
document.getElementById('import-secure').onclick=()=>{if(!window.AlquilaAndroid){alert('La importación cifrada solo está disponible en Android');return}const pass=prompt('Contraseña de la copia cifrada:');if(!pass)return;AlquilaAndroid.importEncryptedBackup(pass)};
document.getElementById('import').onclick=()=>{if(window.AlquilaAndroid){AlquilaAndroid.importBackup();return}document.getElementById('importfile').click()};
function restoreBackupFromAndroid(json){try{const parsed=JSON.parse(json);const d=parsed.data;if(parsed.app!=='Alquila360'||!d||typeof d!=='object'||!sections.slice(1,-1).every(k=>Array.isArray(d[k])&&d[k].length<=50000&&d[k].every(r=>r&&typeof r==='object'&&!Array.isArray(r))))throw Error('Formato de copia no válido');if(d.Ajustes!==undefined&&(typeof d.Ajustes!=='object'||d.Ajustes===null||Array.isArray(d.Ajustes)))throw Error('Datos de propietario no válidos');if(!confirm('¿Restaurar la copia? Sustituirá todos los datos actuales.'))return;const old=db;const next=d;next.Ajustes??={propietario:'',nif:'',direccion:'',email:''};try{localStorage.setItem('alquila360-data',JSON.stringify(next));db=next;render();alert('Copia restaurada correctamente')}catch(storageError){db=old;alert('No se ha restaurado: no se pudieron guardar los datos. La información anterior sigue disponible.')}}catch(err){alert('No se pudo importar: '+err.message)}}
document.getElementById('importfile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{restoreBackupFromAndroid(await f.text())}finally{e.target.value=''}};

function receiptData(c){const contract=db.Contratos.find((x,i)=>contractKey(x,i)===c.contratoKey)||db.Contratos.find(x=>c.concepto.includes(x.inmueble)||x.inmueble===c.concepto);return {owner:db.Ajustes||{},tenant:contract?.inquilino||'No especificado',property:contract?.inmueble||c.concepto,amount:money(c.importe),date:c.fecha||'',state:c.estado||'No indicado',concept:c.concepto||''}}
function receiptHtml(c){const r=receiptData(c),esc=safe;return `<div class="receipt-paper"><h2>Alquila360 · Recibo de alquiler</h2><p><b>Propietario:</b> ${esc(r.owner.propietario||'Sin completar')}</p><p><b>NIF:</b> ${esc(r.owner.nif||'—')}</p><p><b>Dirección del propietario:</b> ${esc(r.owner.direccion||'—')}</p><p><b>Inquilino:</b> ${esc(r.tenant)}</p><p><b>Inmueble:</b> ${esc(r.property)}</p><p><b>Concepto:</b> ${esc(r.concept)}</p><p><b>Fecha:</b> ${esc(r.date)}</p><p><b>Importe:</b> ${esc(r.amount)}</p><p><b>Estado registrado:</b> ${esc(r.state)}</p><small>Documento generado a partir de los datos introducidos. No acredita por sí solo la recepción del pago.</small></div>`}
function receipt(c){document.getElementById('receipt-content').innerHTML=receiptHtml(c);document.getElementById('receipt-modal').classList.remove('hide');document.getElementById('print-receipt').onclick=()=>{const html=`<!doctype html><html lang="es"><head><meta charset="utf-8"><style>body{font:15px Arial;color:#183044;padding:28px}.receipt-paper{max-width:680px;margin:auto}.receipt-paper h2{color:#087f83}.receipt-paper p{padding:12px;border-bottom:1px solid #ddd}</style></head><body>${receiptHtml(c)}</body></html>`;if(window.AlquilaAndroid)AlquilaAndroid.printReceipt(html);else{const w=window.open('','_blank');if(w){w.document.write(html);w.document.close();w.print()}else alert('No se pudo abrir la impresión')}}}
function closeReceipt(){document.getElementById('receipt-modal').classList.add('hide')}
document.getElementById('close-receipt').onclick=closeReceipt;
function handleAndroidBack(){if(!document.getElementById('receipt-modal').classList.contains('hide')){closeReceipt();return true}if(current!=='Resumen'){current='Resumen';render();return true}return false}

async function shareReceipt(c){const r=receiptData(c);const msg=`Alquila360 · ${r.concept}\nInmueble: ${r.property}\nImporte: ${r.amount}\nFecha: ${r.date}\nEstado: ${r.state}`;try{if(navigator.share)await navigator.share({title:'Recibo de alquiler',text:msg});else{await navigator.clipboard.writeText(msg);alert('Texto copiado. Puedes pegarlo en WhatsApp o email.')}}catch(e){if(e.name!=='AbortError')alert('No se pudo compartir: '+e.message)}}

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
